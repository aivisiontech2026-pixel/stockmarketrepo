name: Intraday Paper Trader

# Runs entirely on GitHub's servers, so it trades even when your PC is off.
# Once an hour during NSE market hours, on weekdays, it:
#   restore state -> fetch fresh 5-min bars -> signals -> paper orders -> save state
# Each run catches up on every completed-but-unprocessed 5-min bar since the
# last run, so an hourly cadence still processes every bar in order - it's
# just less real-time than running every 5 min. (GitHub's schedule trigger
# is unreliable at 5-min granularity in practice; hourly fires far more
# consistently.)
#
# The strategy squares off ALL positions at 15:15 IST, so nothing is ever held
# overnight; between-day state is just cash balance + trade history.

on:
  schedule:
    # cron is UTC. Fires on the hour, 08:30-15:30 IST == 03:00-10:00 UTC. Mon-Fri.
    - cron: '0 3-10 * * 1-5'
  workflow_dispatch: {}   # lets you trigger a manual run from the Actions tab

permissions:
  contents: write         # needed to push the trading-state branch

concurrency:
  group: intraday-trader  # never run two passes at once (state would race)
  cancel-in-progress: false

jobs:
  trade:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Kolkata     # make date.today()/now() IST, matching the strategy
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.3.1

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backtest-machine/requirements.txt

      - name: Install dependencies
        run: pip install -r backtest-machine/requirements.txt

      - name: Restore trading state
        run: |
          cd backtest-machine
          if git fetch origin trading-state --depth 1 2>/dev/null; then
            git show FETCH_HEAD:intraday_trades.db > intraday_trades.db
            git show FETCH_HEAD:options_trades.db > options_trades.db 2>/dev/null || true
            echo "Restored prior state from trading-state branch."
          else
            echo "No prior state — starting fresh at Rs.1,00,000."
          fi

      - name: Inject Telegram secrets
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        if: env.TG_BOT_TOKEN != '' && env.TG_CHAT_ID != ''
        run: |
          cd backtest-machine
          python3 << 'INJECT'
          import json, os
          cfg = json.load(open("intraday_config.json"))
          cfg["telegram"]["bot_token"] = os.environ["TG_BOT_TOKEN"]
          cfg["telegram"]["chat_id"] = os.environ["TG_CHAT_ID"]
          json.dump(cfg, open("intraday_config.json", "w"), indent=2)
          print("Telegram secrets injected.")
          INJECT

      - name: Run traders (stocks + options + telegram alerts)
        run: |
          cd backtest-machine
          echo "=== STOCKS ===" | tee run_output.txt
          python intraday_trader.py | tee -a run_output.txt
          echo "" | tee -a run_output.txt
          echo "=== OPTIONS ===" | tee -a run_output.txt
          python options_trader.py | tee -a run_output.txt

      - name: Send EOD report (15:30 IST, once/day)
        if: always()
        run: |
          cd backtest-machine
          python eod_report.py | tee -a run_output.txt

      - name: Save trading state
        if: always()
        run: |
          cd backtest-machine
          [ -f intraday_trades.db ] || { echo "No db to save."; exit 0; }
          tmp="$(mktemp -d)"
          cp intraday_trades.db "$tmp/"
          [ -f options_trades.db ] && cp options_trades.db "$tmp/"
          [ -f run_output.txt ] && cp run_output.txt "$tmp/"
          cd "$tmp"
          git init -q
          git checkout -q -b trading-state
          git add -A
          git -c user.name="intraday-ci" \
              -c user.email="ci@users.noreply.github.com" \
              commit -q -m "state $(date -u +%FT%TZ)"
          git push -f \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
            trading-state
